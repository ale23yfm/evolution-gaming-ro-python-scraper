name: Deduplicate Jobs

on:
  workflow_dispatch:
    inputs:
      company:
        description: 'Company/brand as indexed in SOLR (e.g. "EVOLUTION GAMING")'
        required: true
        type: string
      delete:
        description: 'Delete duplicates and re-attribute the kept listings (default: dry-run)'
        required: false
        default: 'false'
        type: boolean
      limit:
        description: 'Max docs to process, 0 = all (default: 0)'
        required: false
        default: '0'
        type: string
      workers:
        description: 'Parallel URL resolutions (default: 1)'
        required: false
        default: '1'
        type: string
      wait:
        description: 'Seconds to wait between URL resolutions to avoid HTTP 429 (default: 1)'
        required: false
        default: '1'
        type: string
      keep-url:
        description: 'Force the keeper of each group to this URL; if not a member, the whole group is deleted'
        required: false
        default: ''
        type: string
      wipe:
        description: 'Delete ALL listings for the company (no resolution, no keeper); requires delete=true'
        required: false
        default: 'false'
        type: boolean
      delete-workers:
        description: 'Parallel deletes via the peviitor API (default: 8)'
        required: false
        default: '8'
        type: string

jobs:
  deduplicate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run deduplicate
        run: |
          ARGS="--workers ${{ inputs.workers }} --wait ${{ inputs.wait }} --delete-workers ${{ inputs.delete-workers }}"
          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.delete }}" = "true" ]; then
            ARGS="$ARGS --delete"
          else
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.wipe }}" = "true" ]; then
            ARGS="$ARGS --wipe"
          fi
          if [ -n "${{ inputs.keep-url }}" ]; then
            ARGS="$ARGS --keep-url '${{ inputs.keep-url }}'"
          fi
          python3 -m scraper.deduplicate "${{ inputs.company }}" $ARGS
